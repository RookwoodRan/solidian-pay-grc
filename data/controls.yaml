# Solidian Pay — Unified Control Library
# Source of truth for the GRC & AI Governance Suite. Every other artifact
# (OSCAL catalog, Rego policies, the workbook, dashboards) is generated FROM
# this file — do not hand-edit downstream copies.
#
# Framework key:
#   soc2        -> AICPA SOC 2 Trust Services Criteria (TSP section 100, 2017
#                  criteria with 2022 revised points of focus). All five
#                  categories are in scope for this control library:
#                    CC1-CC9  Common Criteria (Security)
#                    A1.x     Availability
#                    C1.x     Confidentiality
#                    PI1.x    Processing Integrity
#                    P1-P8    Privacy
#   iso27001    -> ISO/IEC 27001:2022. Plain numbers are management-system
#                  clauses (e.g. 6.1.2); "A."-prefixed values are Annex A
#                  controls (e.g. A.8.5).
#   iso42001    -> ISO/IEC 42001:2023, same convention: plain numbers are
#                  clauses (e.g. 6.1.4), "A."-prefixed values are Annex A
#                  controls (e.g. A.6.2.4).
#   nist_ai_rmf -> NIST AI RMF 1.0 subcategory (GOVERN/MAP/MEASURE/MANAGE)
#   nist_csf    -> NIST CSF 2.0 subcategory (2.0 adds GOVERN as a function)
#
# Mapping rule: a framework reference is recorded only where the control
# description itself satisfies that clause, control or criterion. Controls are
# deliberately left unmapped against frameworks they do not genuinely address —
# a control with no AI-specific function carries no AI RMF or ISO 42001
# reference.
#
# maturity levels 1-5 map to /data/maturity-rubric.yaml (Initial..Optimized)

schema_version: "2.0"
organization: "Solidian Pay Financial Technologies, Inc."

controls:

  - id: CTL-001
    name: Information Security & AI Governance Policy
    domain: Governance
    description: >
      Establishes and maintains the top-level ISMS/AIMS policy set: security
      objectives, AI governance principles, scope statements, integrity and
      ethical-conduct expectations, and management commitment. Approved by the
      board and reviewed at least annually or on material change.
    control_type: Preventive
    owner: CISO / Head of AI Governance
    frameworks:
      soc2: ["CC1.1", "CC1.2", "CC5.1", "CC5.3"]
      iso27001: ["A.5.1", "5.2", "5.1"]
      iso42001: ["5.2", "5.3", "6.2"]
      nist_ai_rmf: ["GOVERN 1.1", "GOVERN 1.2"]
      nist_csf: ["GV.OC-01", "GV.PO-01"]
    evidence_required: "Signed policy set; version history; annual review record; board approval minutes; code of conduct acknowledgements"
    implementation_status: Implemented
    control_maturity: 4
    evidence_maturity: 3
    notes: "Policy set unified across security and AI governance rather than run as parallel programs"

  - id: CTL-002
    name: Risk Management Framework
    domain: Governance
    description: >
      Defines the enterprise risk methodology (likelihood x impact scoring,
      inherent/residual treatment) applied consistently to security, privacy,
      processing-integrity and AI system risk, including assessment of the
      risk arising from significant change to the system or environment.
    control_type: Preventive
    owner: Head of Risk
    frameworks:
      soc2: ["CC3.1", "CC3.2", "CC3.4"]
      iso27001: ["6.1.2", "6.1.3"]
      iso42001: ["6.1.2", "6.1.3"]
      nist_ai_rmf: ["GOVERN 1.3", "GOVERN 1.5"]
      nist_csf: ["GV.RM-01", "ID.RA-05"]
    evidence_required: "Risk methodology doc; risk register; treatment plans; change-driven reassessment records; management review minutes"
    implementation_status: Implemented
    control_maturity: 4
    evidence_maturity: 3
    notes: "Single risk register covers security, privacy, processing integrity and AI risk lines"

  - id: CTL-003
    name: Roles, Responsibilities & Segregation of Duties
    domain: Governance
    description: >
      Defines accountable owners for the ISMS, AIMS, each material AI use
      case, and each control; establishes reporting lines and holds individuals
      accountable for control responsibilities; enforces segregation between AI
      system development, risk assessment, and approval-to-deploy functions.
    control_type: Preventive
    owner: COO / Chief of Staff
    frameworks:
      soc2: ["CC1.3", "CC1.5"]
      iso27001: ["A.5.2", "A.5.3"]
      iso42001: ["5.3", "A.3.2"]
      nist_ai_rmf: ["GOVERN 2.1"]
      nist_csf: ["GV.RR-01", "GV.RR-02"]
    evidence_required: "RACI matrix; org chart; delegation of authority records; control-owner attestations"
    implementation_status: Implemented
    control_maturity: 3
    evidence_maturity: 3
    notes: "AI use-case owners formally distinct from the engineering teams that build the models"

  - id: CTL-004
    name: Access Control & Least Privilege
