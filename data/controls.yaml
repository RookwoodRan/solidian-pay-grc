    description: >
      Enforces encryption in transit and at rest for customer, payment, and
      model-training data; restricts and protects the transmission, movement
      and removal of information to authorized internal and external users.
    control_type: Preventive
    owner: IT Security
    frameworks:
      soc2: ["CC6.7"]
      iso27001: ["A.8.24", "A.5.14", "A.8.12"]
      iso42001: []
      nist_ai_rmf: []
      nist_csf: ["PR.DS-01", "PR.DS-02"]
    evidence_required: "Encryption configuration evidence; key management procedure; DLP rule set; TLS enforcement scans"
    implementation_status: Implemented
    control_maturity: 4
    evidence_maturity: 4
    notes: ""

  - id: CTL-029
    name: Internal Audit, Monitoring & Management Review
    domain: Governance
    description: >
      Performs ongoing and separate evaluations of control effectiveness
      (internal audit of the ISMS/AIMS and control self-assessment), evaluates
      and communicates deficiencies to parties responsible for corrective
      action, and runs a formal management review that consumes metrics,
      incidents, and audit findings to drive continual improvement.
    control_type: Detective
    owner: Internal Audit
    frameworks:
      soc2: ["CC4.1", "CC4.2", "CC1.2", "P8.1"]
      iso27001: ["9.2", "9.3", "10.1", "A.5.35", "A.5.36"]
      iso42001: ["9.2", "9.3"]
      nist_ai_rmf: ["GOVERN 1.5"]
      nist_csf: ["GV.OV-02", "GV.OV-03", "ID.IM-01"]
    evidence_required: "Internal audit plan and reports; deficiency log with owner and remediation date; management review minutes and action items"
    implementation_status: Implemented
    control_maturity: 3
    evidence_maturity: 3
    notes: "One internal audit cycle completed against the expanded control set"

  - id: CTL-030
    name: Personnel Screening, Competence & Security Awareness
    domain: People & Awareness
    description: >
      Attracts, develops and retains competent personnel: background screening
      proportionate to role sensitivity, defined competence requirements,
      onboarding and annual security and privacy awareness training, role-based
      training for AI and control owners, and a disciplinary process for
      policy violations.
    control_type: Preventive
    owner: HR / People Ops
    frameworks:
      soc2: ["CC1.4", "CC1.5", "CC2.2", "CC5.3"]
      iso27001: ["A.6.1", "A.6.2", "A.6.3", "A.6.4", "7.2", "7.3"]
      iso42001: ["7.2", "7.3"]
      nist_ai_rmf: ["GOVERN 2.2"]
      nist_csf: ["GV.RR-04", "PR.AT-01", "PR.AT-02"]
    evidence_required: "Background check records; job descriptions with competence criteria; training completion reports; disciplinary process document; AI-specific training records for model owners"
    implementation_status: Implemented
    control_maturity: 3
    evidence_maturity: 3
    notes: "Competence and accountability sit with HR rather than security, so they are controlled here rather than inside the policy control"

  - id: CTL-031
    name: Internal & External Communication of Commitments
    domain: Governance
    description: >
      Generates and communicates quality information needed to support control
      functioning: internal communication of objectives, policies and control
      responsibilities, and external communication to customers and other
      parties of service commitments, system requirements, processing quality
      objectives, security practices, and the channel for reporting failures
      and complaints.
    control_type: Preventive
    owner: Compliance / Communications
    frameworks:
      soc2: ["CC2.1", "CC2.2", "CC2.3", "PI1.1"]
      iso27001: ["A.5.1", "7.4", "A.6.8"]
      iso42001: ["7.4"]
      nist_ai_rmf: ["GOVERN 4.2", "GOVERN 5.1"]
      nist_csf: ["GV.RR-01", "GV.OC-02"]
    evidence_required: "Customer-facing trust/security page; published SLAs and processing commitments; internal policy acknowledgement records; incident and complaint reporting channel documentation; management reporting pack"
    implementation_status: In Progress
    control_maturity: 3
    evidence_maturity: 2
    notes: "Covers both directions of communication: control responsibilities communicated internally, and service commitments and the failure-reporting channel communicated externally"

  - id: CTL-032
    name: Physical & Environmental Security
    domain: Physical Security
    description: >
      Restricts physical access to facilities and protected information assets
      to authorized personnel, and maintains environmental protections (power,
      fire suppression, climate control) for on-premises infrastructure
      supporting availability commitments.
    control_type: Preventive
    owner: Facilities / IT Operations
    frameworks:
      soc2: ["CC6.4", "A1.2"]
      iso27001: ["A.7.1", "A.7.2", "A.7.3", "A.7.4", "A.7.5", "A.7.8", "A.7.11"]
      iso42001: []
      nist_ai_rmf: []
      nist_csf: ["PR.AA-06", "PR.IR-02"]
    evidence_required: "Badge access logs; visitor register; quarterly physical access review; environmental monitoring and UPS/fire-suppression test records; cloud provider facility attestations"
    implementation_status: Implemented
    control_maturity: 3
    evidence_maturity: 3
    notes: "Most production infrastructure is cloud-hosted, so this control relies partly on subservice organization attestations (see CTL-026); the corporate offices remain in scope directly"

  - id: CTL-033
    name: Secure Disposal of Media & Confidential Information
    domain: Physical Security
    description: >
      Securely decommissions and disposes of physical media, endpoints and
      storage containing confidential information and personal data, with
      certificates of destruction and verified cryptographic erasure for cloud
      storage.
    control_type: Preventive
    owner: IT Operations
    frameworks:
      soc2: ["CC6.5", "C1.2", "P4.3"]
      iso27001: ["A.7.10", "A.7.14", "A.8.10"]
      iso42001: []
      nist_ai_rmf: []
      nist_csf: ["ID.AM-08"]
    evidence_required: "Asset decommissioning log; certificates of destruction; cryptographic erasure confirmations; media sanitization procedure"
    implementation_status: In Progress
    control_maturity: 2
    evidence_maturity: 2
    notes: "Vendor destruction certificates are not yet consistently retained, which is the main evidence weakness in this control"

  - id: CTL-034
    name: Endpoint & Malware Protection
    domain: Asset Management
    description: >
      Deploys and maintains endpoint detection and response, anti-malware,
      and email/web filtering controls across corporate endpoints and servers
      to prevent and detect the introduction of malicious software.
    control_type: Preventive
    owner: IT Security
    frameworks:
      soc2: ["CC6.8"]
      iso27001: ["A.8.1", "A.8.7", "A.8.23"]
      iso42001: []
      nist_ai_rmf: []
      nist_csf: ["DE.CM-09", "PR.PS-05"]
    evidence_required: "EDR deployment coverage report; signature/agent currency metrics; quarantine and remediation logs; phishing simulation results"
    implementation_status: Implemented
    control_maturity: 4
    evidence_maturity: 3
    notes: "Covers the corporate endpoint estate and servers; cloud workload protection is handled under CTL-008"

  - id: CTL-035
    name: Transaction Processing Integrity & Reconciliation
    domain: Processing Integrity
    description: >
      Ensures payment and ledger processing is complete, valid, accurate,
      timely and authorized: input validation and file-completeness checks at
      ingestion, automated exception queues for failed or suspended
      transactions, daily reconciliation between the processing ledger and
      settlement/bank records, and controlled correction of identified
      discrepancies with output delivered only to authorized recipients.
    control_type: Detective
    owner: Payment Operations / Finance
    frameworks:
      soc2: ["PI1.2", "PI1.3", "PI1.4", "PI1.5"]
      iso27001: ["A.8.26"]
      iso42001: []
      nist_ai_rmf: []
      nist_csf: ["PR.DS-01"]
    evidence_required: "Daily reconciliation reports with sign-off; exception queue aging report; input validation rule set; settlement break log and resolution evidence; output distribution authorization matrix"
    implementation_status: Implemented
    control_maturity: 4
    evidence_maturity: 3
    notes: "For a payments company the completeness and accuracy of transaction processing is the core service commitment, so this control carries most of the Processing Integrity criteria"

  - id: CTL-036
    name: Fraud Risk Assessment
    domain: Processing Integrity
    description: >
      Formally considers the potential for fraud — both external transaction
      fraud and internal fraud/misappropriation — in assessing risks to
      objectives, including fraud scenarios arising from AI-assisted
      decisioning and from management override of controls.
    control_type: Preventive
    owner: Head of Risk / Fraud Operations
    frameworks:
      soc2: ["CC3.3"]
      iso27001: ["6.1.2"]
      iso42001: ["6.1.2"]
      nist_ai_rmf: ["MAP 5.1"]
      nist_csf: ["ID.RA-04"]
    evidence_required: "Annual fraud risk assessment; fraud scenario register; management override monitoring evidence; fraud loss and attempted-fraud reporting"
    implementation_status: Implemented
    control_maturity: 3
    evidence_maturity: 3
    notes: "The AI fraud scoring model (AI-001) appears here as both a fraud control and a source of fraud risk, which is why management override and AI-assisted decisioning are explicit scenarios"

  - id: CTL-037
    name: Business Disruption Risk Mitigation & Insurance
    domain: Resilience
    description: >
      Identifies, selects and develops risk mitigation activities for risks
      arising from potential business disruptions, including maintenance of
      cyber liability and errors-and-omissions insurance appropriate to the
      risk profile, and assessment of concentration risk in critical vendors.
    control_type: Corrective
    owner: Head of Risk / Finance
    frameworks:
      soc2: ["CC9.1"]
      iso27001: ["A.5.29", "A.5.30"]
      iso42001: []
      nist_ai_rmf: []
      nist_csf: ["GV.RM-05", "ID.IM-04"]
    evidence_required: "Business disruption risk assessment; insurance policy schedule and renewal records; vendor concentration analysis; residual risk acceptance records"
    implementation_status: Implemented
    control_maturity: 3
    evidence_maturity: 3
    notes: "Insurance and vendor concentration analysis are the mitigation activities least visible in a technical control set, so they are tracked explicitly here"

  - id: CTL-038
    name: AI System Impact Assessment
    domain: AI Governance
    description: >
      Assesses and documents the potential consequences of AI systems for
      individuals, groups of individuals, and society across the system life
      cycle. Assessments are performed before deployment, at planned intervals,
      and when significant changes are proposed; results are retained and feed
      risk treatment, human-oversight design, and the approval-to-deploy
      decision.
    control_type: Preventive
    owner: AI Governance / Privacy Office
    frameworks:
      soc2: []
      iso27001: []
      iso42001: ["6.1.4", "8.4", "A.5.2", "A.5.3", "A.5.4", "A.5.5"]
      nist_ai_rmf: ["MAP 5.1", "MAP 5.2"]
      nist_csf: ["ID.RA-04"]
    evidence_required: "Impact assessment methodology and template; completed assessments per AI system; reviewer and approver sign-off; change-triggered reassessment log; assessment retention records"
    implementation_status: In Progress
    control_maturity: 2
    evidence_maturity: 2
    notes: "Impact assessment is the requirement that most distinguishes an AI management system from an information security one; template is defined but completed assessments exist only for the fraud scoring and underwriting models"

  - id: CTL-039
    name: Secure Development Lifecycle
    domain: Secure Development
    description: >
      Establishes rules for the secure development of software and systems:
      security requirements identified and approved for applications,
      documented secure architecture and engineering principles, secure coding
      standards enforced through peer review, automated security testing in CI
      (static analysis, dependency and secret scanning, infrastructure-as-code
      policy checks), and security acceptance testing before release. Applies
      to ML pipelines and model-serving code as well as application code.
    control_type: Preventive
    owner: Engineering / Application Security
    frameworks:
      soc2: ["CC8.1"]
      iso27001: ["A.8.25", "A.8.26", "A.8.27", "A.8.28", "A.8.29"]
      iso42001: []
      nist_ai_rmf: []
      nist_csf: ["PR.PS-06"]
    evidence_required: "Secure coding standard; security requirements and threat model records; CI scan reports (SAST, dependency, secret, IaC); code review records; pre-release security test sign-offs; test data handling procedure"
    implementation_status: In Progress
    control_maturity: 3
    evidence_maturity: 2
    notes: "Static analysis and dependency scanning run in CI and the infrastructure-as-code checks are enforced by the Rego policies in policy/rego; threat modelling is not yet a standard step for every service"
