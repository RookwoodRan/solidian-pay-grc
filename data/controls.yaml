    owner: IT Security
    frameworks:
      soc2: ["CC6.1", "CC6.2", "CC6.3"]
      iso27001: ["A.5.15", "A.8.2", "A.8.3", "A.8.5"]
      iso42001: []
      nist_ai_rmf: []
      nist_csf: ["PR.AA-01", "PR.AA-03", "PR.AA-05"]
    evidence_required: "RBAC configs; quarterly access review sign-offs; MFA enforcement reports"
    implementation_status: Implemented
    control_maturity: 4
    evidence_maturity: 4
    notes: "Carried forward from original control library (CL-001); MFA enforced org-wide"

  - id: CTL-005
