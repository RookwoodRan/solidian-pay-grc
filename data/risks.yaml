# Solidian Pay — Risk Register
# Scoring: Likelihood (1-5) x Impact (1-5) = Score. Heat map and treatment plan
# are derived from this file — see /dashboards and /workbook.

schema_version: "2.0"

risks:
  - id: R-001
    asset: AS-001
    description: Cross-cloud IAM misconfiguration leads to unauthorized data access or breach
    inherent_likelihood: 5
    inherent_impact: 5
    inherent_score: 25
    residual_likelihood: 3
    residual_impact: 4
    residual_score: 12
    owner: Cloud Platform
    controls: [CTL-004, CTL-005, CTL-008, CTL-010]
    treatment: Mitigate
    treatment_actions:
      - "Implement unified IAM baseline across AWS and Azure (CTL-008)"
      - "Enable continuous posture monitoring / CSPM (CTL-010)"
      - "Enforce MFA and JIT elevation for cloud admin roles (CTL-004, CTL-005)"
    due_date: "2026-11-30"
    status: In Progress

  - id: R-002
    asset: AS-005
    description: Weak RBAC on CRM leads to unauthorized access to merchant/customer data
    inherent_likelihood: 4
    inherent_impact: 5
    inherent_score: 20
    residual_likelihood: 2
    residual_impact: 4
    residual_score: 8
    owner: Sales
    controls: [CTL-004, CTL-024, CTL-028]
    treatment: Mitigate
    treatment_actions:
      - "CRM RBAC review; remove over-permissioned roles (CTL-004)"
      - "Enforce MFA for all CRM users and admins (CTL-004)"
      - "Encrypt CRM exports and apply masking (CTL-028)"
    due_date: "2026-10-15"
    status: In Progress

  - id: R-003
    asset: AS-009
    description: Firewall rule misconfiguration allows network intrusion
    inherent_likelihood: 5
    inherent_impact: 4
    inherent_score: 20
    residual_likelihood: 3
    residual_impact: 3
    residual_score: 9
    owner: Security Operations
    controls: [CTL-008, CTL-009, CTL-010]
    treatment: Mitigate
    treatment_actions:
      - "Quarterly firewall rule review and baseline update (CTL-008)"
      - "Integrate firewall logging with SIEM (CTL-010)"
      - "Patch firmware vulnerabilities (CTL-009)"
    due_date: "2026-11-01"
    status: Not Started

  - id: R-004
