      - "Publish adverse-action rationale for all declines (CTL-017)"
      - "Underwriter sign-off retained as HOTL control (CTL-016)"
    due_date: "2026-11-15"
    status: In Progress

  - id: R-006
    asset: AI-004
    description: Third-party LLM copilot leaks customer PII through prompts sent to the external vendor
    inherent_likelihood: 3
    inherent_impact: 4
    inherent_score: 12
    residual_likelihood: 2
    residual_impact: 3
